arious medications will affect you, and how\nto spot the signs of potential problems such as vulnerability to falls.\n     Geriatricians see patients with a wide range of common conditions, most of which are chronic disease such as\ndiabetes, hypertension, coronary heart disease, dementia, and even depression. Geriatricians work alongside different\nspecialties to plan and coordinate patients’ care. They can work in many different medical settings, but are mainly based\nin hospital outpatient wards like GP visits.\n    One of the key roles a geriatrician plays is in carrying out a comprehensive medical assessment. When you go to\nthe GP (general practitioner), you might have a number of complaints, not all of which can necessarily be addressed fully.\nA geriatrician’s job is to work out the most important problems you face, including those you haven’t identified yourself,\nand to put together a program of individualized care. A geriatrician’s work is a complex balancing act, and listening to\nyour priorities and the things that are most important for you in life is a key part of the role.\n     Geriatricians are also important when planning your care after an operation or accident. They will work with\nclinicians as well as social care staff to plan your care and help you maintain your independence. Geriatricians are also\ntrained to talk to patients towards the end of their life and help them make appropriate plans. This can include setting out\ntreatment preferences in advance and planning care at the very end of life.\n\nWhat is the main idea of this passage?", "choices": ["The revolution in medicine to lengthen lives.", "The introduction of a medical specialty.", "The new perspective on modern medicine.", "The importance of preventive health care."], "answer": "B", "id": "114080_0401_46", "corrected": false}, {"n": 47, "stem": "閱讀題共用短文：\n：\n     Geriatric medicine is a growing medical specialty that focuses on the care and treatment of older people. Older age\ni od substance. Corbezzolo honey, however, is surprisingly bitter, with notes\nof leather, liquorice and smoke. Born in the mountains of the Italian island of Sardinia, this extremely rare honey has a\nhistory that dates back more than 2,000 years.\n   Corbezzolo honey is obtained from the flowering of the broadleaf corbezzolo shrub, known in English as the\nstrawberry tree for its reddish-orange, strawberry-sized fruits. Despite the bitterness, it is often added to coffee to enhance\nthe drink’s bitter aromas. The special taste also makes the honey pair perfectly with seadas, a typical Sardinian dessert,\nand pecorino sardo, a sweet sheep’s milk cheese. What makes the bitter honey even more special is that it is actually\npacked with nutrients. Rich in vitamins and minerals, it has been prized by many generations in Sardinia, known for the\nnotably long lifespans of its inhabitants, many of whom live to more than 100 years old. It has been used in traditional\nmedicine to suppress coughing and bring on sleep. What’s more, a 2019 study found that the honey might reduce growth\nof cancer cells.\n   The corbezzolo’s fruits ripen slowly and the flowers’ petals unfold slowly, a delicate process that a heavy rain can\neasily bring to a halt. And because the flowering takes place in late autumn when the weather can be cold, rainy and\nwindy, the bees sometimes have to struggle to make it out of their hives to collect that precious nectar. The flowers\nproduce about half as much nectar as other flowers, so the bees have to work extra hard to collect enough. These factors\nmake corbezzolo honey so precious that it’s hard to find outside Sardinia.\n\nWhich of the following aspects of corbezzolo honey is discussed in the second paragraph？", "choices": ["Its history and origin.", "Its making process.", "Its benefits and uses.", "Its potential risks."], "answer": "C", "id": "112090_0119_46", "corrected": false}, {"n": 47, "stem": "閱讀題共用短文：\n：\n  Honey is usually described as a sweet food substance. Corbezzolo honey, however, is surprisingly bitter, with notes\nof leather, liquorice and smoke. Born in the mountains of the Italian island of Sardinia, this extremely rare honey has a\nhistory that dates back more than 2,000 years.\n   Corbezzolo honey is obtained from the flowering of the broadleaf corbezzolo shrub, known in English as the\nstrawberry tree for its reddish-orange, strawberry-sized fruits. Despite the bitterness, it is often added to coffee to enhance\nthe drink’s bitter aromas. The special taste also makes the honey pair perfectly with seadas, a typical Sardinian dessert,\nand pecorino sardo, a sweet sheep’s milk cheese. What makes the bitter honey even more special is that it is actually\npacked with nutrients. Rich in vitamins and minerals, it has been prized by many generations in Sardinia, known for the\nnotably long lifespans of its inhabitants, many of whom live to more than 100 years old. It has been used in traditional\nmedicine to suppress coughing and bring on sleep. What’s more, a 2019 study found that the honey might reduce growth\nof cancer cells.\n   The corbezzolo’s fruits ripen slowly and the flowers’ petals unfold slowly, a delicate process that a heavy rain can\neasily bring to a halt. And because the flowering takes place in late autumn when the weather can be cold, rainy and\nwindy, the bees sometimes have to struggle to make it out of their hives to collect that precious nectar. The flowers\nproduce about half as much nectar as other flowers, so the bees have to work extra hard to collect enough. These factors\nmake corbezzolo honey so precious that it’s hard to find outside Sardinia.\n\nAccording to the passage, which of the following words best describes corbezzolo honey？", "choices": ["Bitter and rare.", "Nutritious and cheap.", "Sweet and expensive.", "Reddish-orange and thick."], "answer": "A", "id": "112090_0119_47", "corrected": false}, {"n": 48, "stem": "閱讀題共用短文：\n：\n  Honey is usually described as a sweet food substance. Corbezzolo honey, however, is surprisingly bitter, with notes\nof leather, liquorice and smoke. Born in the mountains of the Italian island of Sardinia, this extremely rare honey has a\nhistory that dates back more than 2,000 years.\n   Corbezzolo honey is obtained from the flowering of the broadleaf corbezzolo shrub, known in English as the\nstrawberry tree for its reddish-orange, strawberry-sized fruits. Despite the bitterness, it is often added to coffee to enhance\nthe drink’s bitter aromas. The special taste also makes the honey pair perfectly with seadas, a typical Sardinian dessert,\nand pecorino sardo, a sweet sheep’s milk cheese. What makes the bitter honey even more special is that it is actually\npacked with nutrients. Rich in vitamins and minerals, it has been prized by many generations in Sardinia, known for the\nnotably long lifespans of its inhabitants, many of whom live to more than 100 years old. It has been used in traditional\nmedicine to suppress coughing and bring on sleep. What’s more, a 2019 study found that the honey might reduce growth\nof cancer cells.\n   The corbezzolo’s fruits ripen slowly and the flowers’ petals unfold slowly, a delicate process that a heavy rain can\neasily bring to a halt. And because the flowering takes place in late autumn when the weather can be cold, rainy and\nwindy, the bees sometimes have to struggle to make it out of their hives to collect that precious nectar. The flowers\nproduce about half as much nectar as other flowers, so the bees have to work extra hard to collect enough. These factors\nmake corbezzolo honey so precious that it’s hard to find outside Sardinia.\n\nWhat does the word “notes” in the first paragraph most likely refer to？", "choices": ["Plants.", "Sizes.", "Forms.", "Smells."], "answer": "D", "id": "112090_0119_48", "corrected": false}, {"n": 49, "stem": "閱讀題共用短文：\n：\n  Honey is usually described as a sweet food substance. Corbezzolo honey, however, is surprisingly bitter, with notes\nof leather, liquorice and smoke. Born in the mountains of the Italian island of Sardinia, this extremely rare honey has a\nhistory that dates back more than 2,000 years.\n   Corbezzolo honey is obtained from the flowering of the broadleaf corbezzolo shrub, known in English as the\nstrawberry tree for its reddish-orange, strawberry-sized fruits. Despite the bitterness, it is often added to coffee to enhance\nthe drink’s bitter aromas. The special taste also makes the honey pair perfectly with seadas, a typical Sardinian dessert,\nand pecorino sardo, a sweet sheep’s milk cheese. What makes the bitter honey even more special is that it is actually\npacked with nutrients. Rich in vitamins and minerals, it has been prized by many generations in Sardinia, known for the\nnotably long lifespans of its inhabitants, many of whom live to more than 100 years old. It has been used in traditional\nmedicine to suppress coughing and bring on sleep. What’s more, a 2019 study found that the honey might reduce growth\nof cancer cells.\n   The corbezzolo’s fruits ripen slowly and the flowers’ petals unfold slowly, a delicate process that a heavy rain can\neasily bring to a halt. And because the flowering takes place in late autumn when the weather can be cold, rainy and\nwindy, the bees sometimes have to struggle to make it out of their hives to collect that precious nectar. The flowers\nproduce about half as much nectar as other flowers, so the bees have to work extra hard to collect enough. These factors\nmake corbezzolo honey so precious that it’s hard to find outside Sardinia.\n\nAccording to the passage, which of the following plays a role in the bees’ collection of corbezzolo honey？", "choices": ["Pesticide.", "Weather.", "Human activity.", "Mountain height."], "answer": "B", "id": "112090_0119_49", "corrected": false}, {"n": 50, "stem": "閱讀題共用短文：\n：\n  Honey is usually described as a sweet food substance. Corbezzolo honey, however, is surprisingly bitter, with notes\nof leather, liquorice and smoke. Born in the mountains of the Italian island of Sardinia, this extremely rare honey has a\nhistory that dates back more than 2,000 years.\n   Corbezzolo honey is obtained from the flowering of the broadleaf corbezzolo shrub, known in English as the\nstrawberry tree for its reddish-orange, strawberry-sized fruits. Despite the bitterness, it is often added to coffee to enhance\nthe drink’s bitter aromas. The special taste also makes the honey pair perfectly with seadas, a typical Sardinian dessert,\nand pecorino sardo, a sweet sheep’s milk cheese. What makes the bitter honey even more special is that it is actually\npacked with nutrients. Rich in vitamins and minerals, it has been prized by many generations in Sardinia, known for the\nnotably long lifespans of its inhabitants, many of whom live to more than 100 years old. It has been used in traditional\nmedicine to suppress coughing and bring on sleep. What’s more, a 2019 study found that the honey might reduce growth\nof cancer cells.\n   The corbezzolo’s fruits ripen slowly and the flowers’ petals unfold slowly, a delicate process that a heavy rain can\neasily bring to a halt. And because the flowering takes place in late autumn when the weather can be cold, rainy and\nwindy, the bees sometimes have to struggle to make it out of their hives to collect that precious nectar. The flowers\nproduce about half as much nectar as other flowers, so the bees have to work extra hard to collect enough. These factors\nmake corbezzolo honey so precious that it’s hard to find outside Sardinia.\n\nWhich of the following statements about corbezzolo honey can be inferred from the passage？", "choices": ["It could be a secret to longevity.", "It tastes like a sheep milk cheese.", "When properly stored, it can last forever.", "It is an iconic food eaten on a daily basis."], "answer": "A", "id": "112090_0119_50", "corrected": false}], "detected": 50, "answerCount": 50}, {"id": "112090_0301", "year": nts\nin their lives, like bad grades or heartbreak. Hikikomori feel a deep sense of shame that they cannot work at a job like\nordinary people. They think of themselves as worthless and unqualified for happiness. Almost all feel remorse at having\nbetrayed their parents’ expectations.\n  As hikikomori refuse to participate in society, let alone go to work, Japan’s economy also suffers. They diminish the\nsize of the workforce, so they contribute to a tighter labor market. Also, they are not self-sufficient, so when family\nsupport dries up due to death or financial problems, they will need to rely on state assistance.\n   Japanese government plans to set up counseling centers and have support staff visit hikikomori at home in a bid to\nboost the country’s flagging workforce. But some criticize this may put pressure on hikikomori. Professor Jeff Kingston,\nan Asian studies professor in Tokyo, said, “One can only hope that more access to various therapies and public health\ncampaigns to destigmatize the phenomenon will encourage more to seek help, find it, and learn to manage their symptoms\nso that they can lead more productive and fulfilling lives.”\n\nWhat is the passage mainly about?", "choices": ["A group of people who suffer and make others suffer.", "A phenomenon caused by the flagging economy in Japan.", "An efficient system to take care of the unemployed.", "A new medical treatment for the disease called hikikomori."], "answer": "A", "id": "111090_0116_46", "corrected": false}, {"n": 47, "stem": "閱讀題共用短文：\nHikikomori is a psychological condition which makes people shut themselves off from society, often staying in their\nhouses for months on end. There are at least half a million of them in Japan. It was once thought of as a young person’s\ncondition, but sufferers are getting older and staying locked away for longer. It is an economic as well as a social threat\nto the country, and is seriously worrying Japanese government.\n  As of 2015, there were 541,000 ified as especially _____ to your\n      organization and keep them in mind.", "choices": ["relevant", "incompetent", "naturalistic", "arbitrary"], "answer": "A", "id": "108090_0213_32", "corrected": false}, {"n": 33, "stem": "We may easily _____ salespeople who approach us on the street, but we often surrender without knowing it to\n      the ultimate salesman: mass media.", "choices": ["rebound", "reject", "reduplicate", "repeat"], "answer": "B", "id": "108090_0213_33", "corrected": false}, {"n": 34, "stem": "Trash is a problem that has _____ humans since they moved into cities. And dealing with it is messy and expensive.", "choices": ["embarked", "enacted", "plagued", "obliged"], "answer": "C", "id": "108090_0213_34", "corrected": false}, {"n": 35, "stem": "The _____ factor that contributes to having so many immigrants move into this country  is mainly about\n     economic reasons.", "choices": ["risk", "push", "impact", "gravity"], "answer": "B", "id": "108090_0213_35", "corrected": false}, {"n": 36, "stem": "Malaria was believed to be on the verge of _____ when people thought that the introduction of insecticides\n      signaled the end of the malaria-carrying mosquito.", "choices": ["persuasion", "eradication", "domination", "contamination"], "answer": "B", "id": "108090_0213_36", "corrected": false}, {"n": 37, "stem": "Lured by false promises of a good job, a stable conflict-free environment or even a loving romantic relationship,\n      victims of human _____ are then pushed into forced labor or sexual exploitation.", "choices": ["trafficking", "slavery", "migration", "distribution\n第38 題至第41 題為篇章結構，各題請依文意從四個選項中選出最合適者，答案選用不能重複：\n    The suspected suicide of actor and comedian Robin Williams is being linked, in part, to depression. Many\nAmericans suffer from the condition. But, many also are trying to help people with depression. They are finding ways\nto bring attention to depression and ways to treat it.\n    For example, thousands of people take part in what are called “Out of the Darkness Walks.”    38   They also\nhope to raise money for suicide prevention efforts and research into depression.\n     Steve Iselin served in the Navy for 20 years. After his retirement, he began to look for another job. That is when\nhe began feeling hopeless. He said,“I had a great sense of dread every day. Agony is another word that comes to mind.\nI didn’t want to do anything that I would normally like to do. I had no interest in seeing other people.” Steve Iselin did\nfind a job. But he left after one week because he told himself he could not do the work. Everything he did seemed very\ndifficult. Decisions were painful, even having to choose what he would wear that day or what to eat. Mr. Iselin was\nsuffering from depression.\n    Bob Gebbia heads the American Foundation for Suicide Prevention. He says being depressed is very different\nfrom being sad or having a bad day. He says that about 20 million people are found to have clinical depression in the\nUnited States every year.    39   He notes that some people are more likely than others to get depressed. “Let’s say\nyou lose your job, divorce, or, you know, a loss of someone.”\n     After Robin Williams’ death, the American Foundation for the Prevention of Suicide released a statement.\nThe foundation said Mr. Williams: “brought laughter into every  life he touched; Robin also suffered from\ndepression.    40    Every 13 minutes someone dies from suicide, and it is among the top ten causes of death in the\nU.S.” The group said more needs to be done to prevent suicides. It called for greater attention to mental health issues,\nwarning signs, and effective forms of intervention and treatment.\n    Steve Iselin was lucky. His wife recognized the signs of depression. She helped him get the expert care he\nneeded. But he says that was not true of his brother’s son. Mr. Iselin says his nephew became depressed a few years\nlater and killed himself. A year after his nephew’s death, Mr  ocean will still warm by between 5°C and 9°C compared with their\n1986-2005 average.\n    The second feedback loop concerns not the water but the land. In the Arctic much of this is permafrost. That\nfrozen soil locks up a lot of organic material. If the permafrost melts its organic contents can escape as a result of fire\nor decay, in the form of carbon dioxide or methane (which is a more potent greenhouse gas than CO2). This will speed\nup global warming directly--and the soot from the fires, when it settles on the ice, will darken it and thus speed its\nmelting still more.\n\nWhich of the following is the main idea of the second paragraph?", "choices": ["To raise doubts about the optimism that climate-change disbelievers express.", "To introduce potential commerce that an ice-free Arctic ocean may bring.", "To indicate incomplete knowledge people have of the Arctic’s economy.", "To differentiate the views of those who fear climate-change from those who don’t."], "answer": "A", "id": "108090_0213_46", "corrected": false}, {"n": 47, "stem": "閱讀題共用短文：\n：\n    Those who doubt the power of human beings to change Earth’s climate should look to the Arctic, and shiver.\nThere is no need to pore over records of temperatures and atmospheric carbon-dioxide concentrations. The process is\nstarkly visible in the shrinkage of the ice that covers the Arctic ocean. In the past 30 years, the minimum coverage of\nsummer ice has fallen by half; its volume has fallen by three-quarters. On current trends, the Arctic ocean will be\nlargely ice-free in summer by 2040.\n    Climate-change sceptics will shrug. Some may even celebrate: an ice-free Arctic ocean promises a shortcut for\nshipping between the Pacific coast of Asia and the Atlantic coasts of Europe and the Americas, and the possibility of\nprospecting for perhaps a fifth of the planet’s undiscovered supplies of oil and natural gas. Such reactions are\nprofoundly misguided. Never mind that the low price of oil and gas means se  "在全球地緣政治競爭中，半導體晶片已經成為最關鍵的科技，請說明兩\n  者的關聯性。（10 分）此外，近年美國國會積極立法推展半導體製造本\n  土化及非紅供應鏈，請解釋這兩項政策的內涵。（15 分）"}, {"id": "115080_0303_essay_1", "exam": "115080_0303", "year": 115, "subject": "行政學", "source": "115080_0303_行政學.pdf", "n": 1, "stem": "在社群媒體快速發展、假訊息擴散及民意高度分歧的情況下，政府公共\n  關係工作面臨前所未有的挑戰。試說明政府推動公共關係時，可採取那\n  些主要策略與具體作法，以增進民眾對政府政策之理解與支持。（25 分）"}, {"id": "115080_0303_essay_2", "exam": "115080_0303", "year": 115, "subject": "行政學", "source": "115080_0303_行政學.pdf", "n": 2, "stem": "公、私部門最大差異在於公部門常常面臨多元價值的權衡，請問：多元\n  價值所指涉的意涵為何？價值衝突是否及如何反映在行政機關的組織\n  設計與安排，請舉例說明。（25 分）"}, {"id": "115080_0403_essay_1", "exam": "115080_0403", "year": 115, "subject": "行政法", "source": "115080_0403_行政法.pdf", "n": 1, "stem": "甲公司近年來虧損連連，其董事乙為解決公司財務困難，乃與丙環境檢\n  測公司商量，約定甲以每年30 萬酬勞給付丙，由丙公司為甲公司的指定\n  固定污染設備進行定期環境檢測，若有檢測結果不合法律標準，即偽造\n  數據以使甲能提出符合標準之環境檢測報告。從109 年6 月開始，甲依\n  據丙提供之環境檢測報告，向環境主管機關申報，未曾被認定違法而受\n   裁罰。115 年6 月，X 大學環境工程教授丁進行環境研究，發現甲工廠\n  排放數據超標與環境部公開資訊不合。主管機關調查後始發現，丙環境\n  檢測公司基於甲的指示，提供不實之環境檢測數據供申報。至115 年7\n  月為止，已有24 次申報不實環境資訊的紀錄。空氣污染防制法第20 條\n  第1 項規定：「公私場所固定污染源排放空氣污染物，應符合排放標準」；\n  第21 條第1 項規定：公私場所具有經中央主管機關指定公告之固定污\n  染源者，應定期向主管機關申報其固定污染源前一季空氣污染物排放\n  量。同法第62 條第1 項規定，公私場所違反第21 條第1 項、22 條第1\n  項或21 條第2 項所定辦法有關空氣污染物季排放量之記錄、申報及管\n  理事項之規定，得處新臺幣二萬元以上一百萬元以下罰鍰，情節重大者\n  得令其停工、停業。請問，主管機關確認甲違反空氣污染防制法相關規\n  定並裁處後，得否裁罰丙檢測公司或追繳其因提供不實檢測報告之所得\n  利益？（25 分）\n                                                                           31350、31450\n                                                                           31850、32750\n                                                                           32850、33050\n                                                                             33250"}, {"id": "115080_0403_essay_2", "exam": "115080_0403", "year": 115, "subject": "行政法", "source": "115080_0403_行政法.pdf", "n": 2, "stem": "甲為獨子，因其父生活自理能力有限，無法獨立生活，委由某私立長照\n  中心照護其父。因甲自112 年1 月起未繳交照護費用，主管機關新北市\n  政府即依老人福利法相關規定，將甲之父保護安置於該私立長照中心，\n   並於115 年3 月25 日發函向甲追繳自112 年1 月1 日至115 年2 月28\n  日之安置費用，並命限期繳納。其間，甲另向臺灣新北地方法院聲請減\n  輕或免除扶養義務，經地方法院於115 年6 月3 日裁定准予免除扶養義\n  務並確定。甲旋即於同年6 月16 日持該法院確定裁定，向新北市政府\n  社會局請求撤銷新北市政府115 年3 月25 日函。依行政程序法相關規\n  定，請問新北市政府社會局及新北市政府應分別如何處理始為適法？\n   （25 分）"}, {"id": "114080_0302_essay_1", "exam": "114080_0302", "year": 114, "subject": "政治學概要", "source": "114080_0302_政治學概要.pdf", "n": 1, "stem": "在當代政治環境中，傳統的「權威」來源正面臨數位資訊流通與公民意\n  識抬頭的挑戰。請說明「權力」、「權威」、「正當性」三者之間的關係，\n  並分析在臺灣近年抗議運動或網路政治參與中，政府如何重建其統治的\n  正當性基礎。（25 分）"}, {"id": "114080_0302_essay_2", "exam": "114080_0302", "year": 114, "subject": "政治學概要", "source": "114080_0302_政治學概要.pdf", "n": 2, "stem": "請問選舉制度中的杜瓦傑法則（Duverger’s Law）為何？請說明之。（25 分）"}, {"id": "114080_0303_essay_1", "exam": "114080_0303", "year": 114, "subject": "行政學", "source": "114080_0303_行政學.pdf", "n": 1, "stem": "近年來，在性別主流化的潮流趨勢下，政府部門積極落實性別平等原則，\n   試從代表性官僚體制（representative bureaucracy）的觀點，闡述政府部\n  門落實此一原則具有什麼意涵。（25 分）"}, {"id": "114080_0303_essay_2", "exam": "114080_0303", "year": 114, "subject": "行政學", "source": "114080_0303_行政學.pdf", "n": 2, "stem": "請以公部門為中心，運用「組織文化」的概念來分析「跨部門治理」的\n  挑戰及其緩解之道。（25 分）"}, {"id": "114080_0403_essay_1", "exam": "114080_0403", "year": 114, "subject": "行政法", "source": "114080_0403_行政法.pdf", "n": 1, "stem": "甲財團法人為辦理友善新住民活動，向A 市政府社會局申請補助新臺幣\n  （下同）二十萬元，A 市政府檢核相關申請文件後，以B 函通知甲財團\n  法人通過補助，核發第一期補助款十萬元，並請甲財團法人舉辦活動後，\n  檢附相關支出憑證以辦理核銷，並於三個月後檢具第一期成果報告書，\n  經審查通過後再申請支付第二期補助款。不料甲財團法人檢具之支出憑\n  證不但未齊全，成果報告書之資料經查多處偽造不實，試問：A 市政府\n  社會局應如何向甲財團法人要求返還已經支付之補助款十萬元，並不支\n  付第二期補助款？（25 分）"}, {"id": "114080_0403_essay_2", "exam": "114080_0403", "year": 114, "subject": "行政法", "source": "114080_0403_行政法.pdf", "n": 2, "stem": "一般認為法院應全面審查不確定法律概念的解釋與適用，僅在少數例外\n  情形，才適用判斷餘地理論。然而，為何要承認判斷餘地？是否存有判\n  斷餘地，該如何認定？有關核能發電廠之設置與運轉等許可行政行為，\n  應否承認行政機關享有判斷餘地，理由何在？試申述之。（25 分）"}, {"id": "113080_0302_essay_1", "exam": "113080_0302", "year": 113, "subject": "政治學概要", "source": "113080_0302_政治學概要.pdf", "n": 1, "stem": "請分析和解釋美國總統制下的權力分立（請按照第一權、第二權和第三\n  權順序說明）和權力制衡的原則，以及總統、國會和最高法院三個權力\n  機關之間彼此如何進行權力制衡？（25 分）"}, {"id": "113080_0302_essay_2", "exam": "113080_0302", "year": 113, "subject": "政治學概要", "source": "113080_0302_政治學概要.pdf", "n": 2, "stem": "關於民主政治的實際運作，主要有菁英論（elitism）與多元論（pluralism）\n  兩種觀點。請說明菁英論與多元論如何描繪現實經驗中民主政治的實際\n   運作。（25 分）"}, {"id": "113080_0303_essay_1", "exam": "113080_0303", "year": 113, "subject": "行政學", "source": "113080_0303_行政學.pdf", "n": 1, "stem": "組織管理的功能包含規劃、組織、領導與控制等四項，請舉政府部門實\n  例申論各項功能。（25 分）"}, {"id": "113080_0303_essay_2", "exam": "113080_0303", "year": 113, "subject": "行政學", "source": "113080_0303_行政學.pdf", "n": 2, "stem": "請闡釋目標管理（Management By Objectives, MBO）應用於政府績效管\n  理所具有的重要特徵為何？（25 分）"}, {"id": "113080_0403_essay_1", "exam": "113080_0403", "year": 113, "subject": "行政法", "source": "113080_0403_行政法.pdf", "n": 1, "stem": "某甲因於臺北市工作，因此於文山區考試院附近，向房東某乙租賃頂樓\n  加蓋房屋一間供居住，因屬違建不具房屋稅稅籍，111 年8 月1 日向內\n  政部線上申請3 百億元中央擴大租金補貼專案計畫補貼，內政部審查通\n   過並於111 年9 月1 日起每月領有3600 元租金補貼。但112 年5 月1 日\n  時內政部清查後發現，某甲所租的房屋未具房屋稅稅籍，因此不符合111\n  年8 月某甲申請時之「三百億元中央擴大租金補貼專案計畫補貼作業規\n  定」的規定。就此，內政部可否撤銷該補貼，而當事人會申請補貼乃因為\n  工作所得不佳，家庭環境不好，因此無法負擔臺北市高額房租，且已經領\n  取之房租補貼已繳交給房東，無法返還，請問內政部有無可以解決的方\n  式？（25 分）"}, {"id": "113080_0403_essay_2", "exam": "113080_0403", "year": 113, "subject": "行政法", "source": "113080_0403_行政法.pdf", "n": 2, "stem": "A 長照機構與B 直轄市政府衛生局（下稱B 衛生局）簽有「B 直轄市特\n  約長期照顧家庭照顧者喘息服務行政契約書」（下稱行政契約），提供相\n  關喘息服務，行政契約中有A 長照機構依行政程序法第148 條自願接受\n  執行之約定。B 衛生局發現A 長照機構有虛報費用之情事，依行政契約\n  之約定可處虛報費用金額10 倍之違約金，合計新臺幣50 萬元。B 衛生\n  局遂限期通知甲繳納，催繳函並有「若逾期不履行，本局依法移送行政\n  執行分署強制執行」之記載。假設A 長照機構甲逾期仍未繳還公費，B 衛\n  生局得否以催繳函為執行名義移送該管行政執行分署強制執行？（25 分）"}, {"id": "112090_0306_essay_1", "exam": "112090_0306", "year": 112, "subject": "政治學概要", "source": "112090_0306_政治學概要.pdf", "n": 1, "stem": "源自十八世紀末期的保守主義（conservatism），主要是對法國大革命的反\n  思。請敘述保守主義主要觀點，並加以評論。（25分）"}, {"id": "112090_0301_essay_1", "exam": "112090_0301", "year": 112, "subject": "行政學", "source": "112090_0301_行政學.pdf", "n": 1, "stem": "有關行政官僚專業責任的探討，學者的論點迭有變更而不同於傳統公共\n  行政；請分別敘述新公共行政（New Public Administration）與黑堡宣言\n   （Blacksburg Manifesto）的觀點為何？（25分）"}, {"id": "112090_0301_essay_2", "exam": "112090_0301", "year": 112, "subject": "行政學", "source": "112090_0301_行政學.pdf", "n": 2, "stem": "何謂「PDCA循環（PDCACycle）」（或稱戴明迴圈，Deming Cycle）？又\n  如何將之應用在組織的員工訓練業務上？（25分）"}, {"id": "112090_0403_essay_1", "exam": "112090_0403", "year": 112, "subject": "行政法", "source": "112090_0403_行政法.pdf", "n": 1, "stem": "A市政府為管理市內攤販經營事業，制定攤販管理自治條例。其中規定，\n  攤販經營許可申請，如涉及私人土地，而不違反現行法令規定者，應檢具\n  所有權人同意書。市民丙申請經營攤販位於他人丁之所有土地上，於申請\n  時檢附所有權人丁之同意書，市政府發給許可證。於證件背面註記注意事\n  項：核准設攤地點涉及私人土地經所有權人提出異議時，應於一個月內提\n  供所有權人同意書，逾期未補正者，本府得註銷許可證之效力。丙開始經\n  營後，丁欲收回租地，向A市政府表示異議，市政府遂要求丙提出同意書，\n  逾期將廢止許可證。一個月期間過後，丙未能提出同意書，故市政府以B\n  函註銷許可證。請問：B函是否合法？（25分）"}, {"id": "112090_0403_essay_2", "exam": "112090_0403", "year": 112, "subject": "行政法", "source": "112090_0403_行政法.pdf", "n": 2, "stem": "甲檢具陳情書向某政府乙機關陳情，主張甲所有建物（下稱系爭建物）之\n  相鄰建物違法施工裝潢，因其室內裝修廠商未具施工許可證，為保障系爭\n  建物之安全，乃訴求乙禁止相鄰建物繼續施工。乙回復甲略以：經查系爭\n  建物之相鄰建物，業已委託設計建築師及合格室內裝修廠商施工，其施工\n  期間及竣工查驗之結構安全，併由設計建築師簽證負責；且該址業由審查\n  機構之審查人員辦理竣工審查，並取得室內裝修合格證明在案等語。甲不\n  服，循序提起行政訴訟。試問：甲有無請求乙對檢舉內容為事實調查予以\n  裁罰之公法上請求權，並具提起行政訴訟之原告適格？（25分）"}, {"id": "111090_0306_essay_1", "exam": "111090_0306", "year": 111, "subject": "政治學概要", "source": "111090_0306_政治學概要.pdf", "n": 1, "stem": "近年來因為新冠疫情（COVID-19）全球肆虐，除了公共衛生體系的挑戰\n  外，甚至衍生至民主治理的危機。請從行政權擴張、人權限制以及民粹\n  主義等面向，分別敘述疫情治理對民主政治的衝擊。（25 分）"}, {"id": "111090_0306_essay_2", "exam": "111090_0306", "year": 111, "subject": "政治學概要", "source": "111090_0306_政治學概要.pdf", "n": 2, "stem": "根據我國憲法與相關法律的規定，立法院監督總統和行政院院長的權力\n  有那些？請詳細說明之。（25 分）"}, {"id": "111090_0301_essay_1", "exam": "111090_0301", "year": 111, "subject": "行政學", "source": "111090_0301_行政學.pdf", "n": 1, "stem": "當代公私部門的界限逐漸模糊，公私協力成為相當普遍的治理模式，請\n  探討公私協力對於公部門的影響，以及對於私部門（包括企業、公民團\n  體與社區）的影響。（25 分）"}, {"id": "111090_0301_essay_2", "exam": "111090_0301", "year": 111, "subject": "行政學", "source": "111090_0301_行政學.pdf", "n": 2, "stem": "美國行政學者賽耶（Wallace Sayre）曾說過，為了提升組織的效率與效\n  能，公部門與私人企業的管理「在所有不重要的面向上，大多是相同的。」\n  請問以上所謂相同的部分是指那些功能？公共行政又有那些與企業管\n  理不同的重要面向？（25 分）"}, {"id": "111090_0403_essay_1", "exam": "111090_0403", "year": 111, "subject": "行政法", "source": "111090_0403_行政法.pdf", "n": 1, "stem": "依戶籍法第48 條第1 項規定，戶籍登記之申請，應於事件發生或確定\n   後30 日內為之。據此，申請人有依法定期限向戶政事務所辦理戶籍登記\n  之義務，如申請人不於期限內辦理戶籍登記者，即依同法（舊法）第79\n  條之規定處新臺幣300 元以上900 元以下罰鍰。假設國人某甲於國外結\n  婚後6 個月，該（新法）第79 條經修法而變更處以新臺幣1000 元以上\n    1500 元以下罰鍰，故後法比較前法顯有更重之行政罰。申請人於結婚後\n    1 年，始回國申請辦理結婚登記。\n  試問：行政機關應依戶籍法第79 條之新法或舊法來處罰申請人？並請\n  申述其理由。（25 分）"}, {"id": "111090_0403_essay_2", "exam": "111090_0403", "year": 111, "subject": "行政法", "source": "111090_0403_行政法.pdf", "n": 2, "stem": "A 直轄市都市發展局依行政程序法第16 條規定，委託某民間開發公司\n   B 改造該直轄市之某老舊市區。B 公司爰於受委託之權限範圍內與甲下\n  水道工程公司締結行政契約，約定甲負責清理、淨化該市區淤積之下水\n  道，而B 則於必要範圍內，依法發給甲各項工程許可及廢棄物清理許可。\n  準此，甲若依約向B 申請下水道之某工程許可，而B 拒絕發給時，甲應\n  提起何種類型之行政訴訟，以為救濟？甲如情況急迫，有聲請暫時權利\n  保護之必要時，應向B、A，抑或行政法院聲（申）請那一種類型之暫時\n  權利保護？（25 分）"}, {"id": "110090_0506_essay_1", "exam": "110090_0506", "year": 110, "subject": "政治學概要", "source": "110090_0506_政治學概要.pdf", "n": 1, "stem": "近年來，政治文化對於政治體系的影響，受到諸多社會科學研究者的重\n  視。試說明政治文化對於政治體系可能產生的影響。（25 分）"}, {"id": "110090_0506_essay_2", "exam": "110090_0506", "year": 110, "subject": "政治學概要", "source": "110090_0506_政治學概要.pdf", "n": 2, "stem": "多數民主國家的投票率並不高，什麼樣的選民比較願意出來投票？解釋\n  選民出來投票的理論很多，請依據唐斯（Downs）在1957 年出版《民主\n  的經濟理論》（An Economic Theory of Democracy）這本書的觀點，選民\n  出來投票的原因為何？唐斯的觀點有什麼需要修正的地方？（25 分）"}, {"id": "110090_0501_essay_1", "exam": "110090_0501", "year": 110, "subject": "行政學", "source": "110090_0501_行政學.pdf", "n": 1, "stem": "學者哈蒙（Michael M. Harmon）以回應性和開創性二個構面，提出了「行\n   政類型格道」（administrative style grid），將公共行政人員劃分為五種類\n  型。請敘述其五種類型公共行政人員的意涵及其對公共行政可能產生的\n  影響；其次，依己見闡述在抗防新冠疫情時期，此五種類型的公共行政\n  人員各自適合擔任何種工作（本題所指工作即例如：防疫指揮官、發言\n  人、公衛行政官員、行政管理人員等概念性名稱，不限定使用法定正式\n  職稱）？（25 分）"}, {"id": "110090_0501_essay_2", "exam": "110090_0501", "year": 110, "subject": "行政學", "source": "110090_0501_行政學.pdf", "n": 2, "stem": "行政機關推動「績效管理」（performance management）必然會帶來正面\n  效益嗎？（10 分）如何確保績效管理的正面效益大於負面成本？（15 分）\n  請闡述之。"}, {"id": "110090_0603_essay_1", "exam": "110090_0603", "year": 110, "subject": "行政法", "source": "110090_0603_行政法.pdf", "n": 1, "stem": "甲市為加強管理違章建築，遂制定「甲市違章建築管理自治條例」，其\n  中規範有違章建築拆除費用負擔之收費基準，另外亦訂有違反該自治條\n  例的罰則。請問：\n  乙之違章建築遭拆除後，不服甲市主管機關收取拆除費用過高，遂提\n   起行政爭訟，主張「甲市違章建築管理自治條例」涉及人民之權利義\n   務，但其並非立法院三讀通過之法律，有違憲法第23 條的法律保留原\n   則。其主張有無理由？（15 分）\n  甲市違章建築管理自治條例相關案件提起行政爭訟時，若承審法官認\n   為罰則已違反比例原則，此時承審法官是否仍應於個案審理時援引為\n   審判之依據？（10 分）"}, {"id": "110090_0603_essay_2", "exam": "110090_0603", "year": 110, "subject": "行政法", "source": "110090_0603_行政法.pdf", "n": 2, "stem": "試論述下列案例的某丙與某丁，得否以及如何提起行政爭訟？\n  Ａ國立大學位於風光明媚的河岸邊，校園環境優良，附近居民喜愛帶\n   飼養犬隻前往散步。為維護校園安全，遂訂立「Ａ國立大學犬隻管理\n   規則」，規定「除導盲犬與工作犬外，民眾攜帶犬隻，應依規定繫狗鍊\n   或做好防護措施，否則不得進入校園。已進入校園者，得予驅離，並\n   禁止一定期間內不得入校」。居民某丙某日帶自家犬隻前往，因犬隻便\n   溺需求，遂解除狗鍊，經校警發現後，通報大學管理單位。A 大學遂\n   以C 函通知丙，於文到三個月內禁止其攜帶犬隻進入校園。丙不服C\n   函，欲提起救濟。（12 分）\n  Ｂ國立大學校地廣大，為維護校園通行秩序與安全，遂訂立「Ｂ國立\n   大學車輛管理辦法」，規定車輛通行、停放、違規處理等管理規則。某\n   丁為該校大學部學生，多次違反停車規定，經學校開立車輛違規事件\n   通知單，並依規定繳納違規處理費。某丁不服通知單，欲提起救濟。\n    （13 分）\n                                                                                    31450、31550\n                                                                                    32250、32950\n                                                                                            33050\n                                                                                    33250－33450\n                                                                                            33850"}, {"id": "109090_0607_essay_1", "exam": "109090_0607", "year": 109, "subject": "政治學概要", "source": "109090_0607_政治學概要.pdf", "n": 1, "stem": "請分析「國會」在「總統制」、「內閣制」及「半總統制」中角色與功能的\n  異與同。（25分）"}, {"id": "109090_0607_essay_2", "exam": "109090_0607", "year": 109, "subject": "政治學概要", "source": "109090_0607_政治學概要.pdf", "n": 2, "stem": "對於年齡會影響民意或選舉投票，主要有兩種理論，試問此兩種理論為\n 何？其主要的理論基礎是什麼？目前國內有那些政治議題或政治態度與\n  年齡是有關係的？他們可用那一種理論解釋？（舉出兩個例子）（25分）"}, {"id": "109090_0604_essay_1", "exam": "109090_0604", "year": 109, "subject": "行政學", "source": "109090_0604_行政學.pdf", "n": 1, "stem": "新公共管理帶動政府再造趨勢，請問「資訊科技」運用於政府機關對公部\n  門的內部管理有何影響與衝擊？（25分）"}, {"id": "109090_0604_essay_2", "exam": "109090_0604", "year": 109, "subject": "行政學", "source": "109090_0604_行政學.pdf", "n": 2, "stem": "基層官僚與公民直接接觸具有一定程度的裁量權與自主性，請探討基層\n  官僚在實際執行公務時可能形成的政治與社會影響。（25分）"}, {"id": "109090_0801_essay_1", "exam": "109090_0801", "year": 109, "subject": "行政法", "source": "109090_0801_行政法.pdf", "n": 1, "stem": "A向B機關申請補助，遭B機關否准，A認為B機關承辦人員有意阻撓，欲\n 請求B機關提供有關其申請補助之相關承辦人員簽核該公文所表示之內\n  容。試問：A應依何種法規請求B機關提供上述公文？B機關可否拒絕提供\n  該公文？B機關若不提供該公文，A應如何提起救濟？（25分）"}, {"id": "109090_0801_essay_2", "exam": "109090_0801", "year": 109, "subject": "行政法", "source": "109090_0801_行政法.pdf", "n": 2, "stem": "甲於其住處頂樓飼養鴿子，影響附近環境衛生，經民眾一再向A市環境保\n  護局陳情，A市環保局所屬環保稽查員乃於109年2月4日上午10時40分許\n 會同警方前往稽查，認定甲於前揭地點飼養鴿子，確實有未妥善清掃管\n  理，造成羽毛、糞便四溢之情形，顯已影響環境衛生，即依違反廢棄物清\n  理法第27條第9款規定告發，並依同法第50條規定裁處甲新臺幣1,200元罰\n  鍰，並限期至109年2月20日完成改善，屆時未改善則按日連續處罰。甲屆\n  期未報請A市環保局查驗，試問環保局是否應查驗，未改善者，始得逐日\n  處罰？又得否一次按日數裁罰合併送達？（25分）\n  參考法條：\n  廢棄物清理法第27條\n  在指定清除地區內嚴禁有下列行為：（其餘各款略）\n  九、飼養禽、畜有礙附近環境衛生。\n  廢棄物清理法第50條\n  有下列情形之一者，處新臺幣一千二百元以上六千元以下罰鍰。經限期改善，屆期仍未完成改善\n  者，按日連續處罰："}, {"id": "109090_0801_essay_5", "exam": "109090_0801", "year": 109, "subject": "行政法", "source": "109090_0801_行政法.pdf", "n": 5, "stem": "為第二十七條各款行為之一。\n  廢棄物清理法第61條\n  本法所稱按日連續處罰，其起算日、暫停日、停止日、改善完成認定查驗及其他應遵行事項，由\n  中央主管機關定之。\n  違反廢棄物清理法按日連續處罰執行準則第3條第2項\n  本法所稱改善完成，指完成前項改善行為，並檢齊證明文件報請處分機關查驗，經處分機關查驗\n  符合規定者。\n                                                                             31450、31550\n                                                                             32450、33250\n                                                                             33350、33550\n                                                                             33750、33850"}, {"id": "108090_0610_essay_1", "exam": "108090_0610", "year": 108, "subject": "政治學概要", "source": "108090_0610_政治學概要.pdf", "n": 1, "stem": "近年來全球興起所謂的民粹主義，其特色為何？民粹主義是否為意識型\n  態？意識型態的定義為何？（25 分）"}, {"id": "108090_0610_essay_2", "exam": "108090_0610", "year": 108, "subject": "政治學概要", "source": "108090_0610_政治學概要.pdf", "n": 2, "stem": "何謂「社會資本」（social capital）？美國政治學者普特曼（Robert Putnam）\n  使用社會資本的概念分析美國與義大利，請敘述他的觀點，並評論之。\n   （25 分）"}, {"id": "108090_0607_essay_1", "exam": "108090_0607", "year": 108, "subject": "行政學", "source": "108090_0607_行政學.pdf", "n": 1, "stem": "行政學奠基學者威爾遜（Woodrow Wilson）對行政學說及政府運作，有\n  何主張？另就今日治理系絡而言，其論述有何不足之處？（25 分）"}, {"id": "108090_0607_essay_2", "exam": "108090_0607", "year": 108, "subject": "行政學", "source": "108090_0607_行政學.pdf", "n": 2, "stem": "請試述政治人物（議員或政務官）與行政人員（即常任文官）在政策和\n  行政管理領域上，可能處於那些類型的角色責任或分工關係？（25 分）"}, {"id": "108090_0801_essay_1", "exam": "108090_0801", "year": 108, "subject": "行政法", "source": "108090_0801_行政法.pdf", "n": 1, "stem": "甲為某領有普通級營業級別證之電子遊戲場業負責人，卻於營業場所內\n  擺設限制級機具。經民眾檢舉，乙縣政府乃以該遊戲場業有混合營業級\n  別經營之情事，依電子遊戲場業管理條例第25 條規定，對甲處以新臺\n  幣（下同）20 萬元之罰鍰，並限期15 日內改善（A 函）。於改善期間屆\n  至後，乙縣政府派員訪查，發現甲仍有混合營業級別經營之情事，遂對\n  甲處以40 萬元之罰鍰（B 函），並限期15 日內改善。其後，乙縣政府確\n  認甲一直處於未改善之違章營業狀態，遂陸續對甲處以60 萬元罰鍰並\n  限期15 日內改善（C 函）及80 萬元罰鍰並限期15 日內改善之處分（D\n  函）。請依電子遊戲場業管理條例第25 條之規定，說明乙對甲所為之A、\n  B、C、D 函有無裁量權行使之瑕疵？（25 分）\n  參考法條：\n  電子遊戲場業管理條例第25 條：\n  電子遊戲場業有混合營業級別經營者，處負責人20 萬元以上100 萬元以下罰鍰，\n  並命其限期改善；屆期未改善，仍繼續營業者，廢止其電子遊戲場業營業級別證。"}, {"id": "108090_0801_essay_2", "exam": "108090_0801", "year": 108, "subject": "行政法", "source": "108090_0801_行政法.pdf", "n": 2, "stem": "經濟部水利署河川局基於某河川防汛之需要，依法定程序報經內政部核\n  准徵收該河川沿岸土地，以實施堤防興建工程，並於徵收案公告期滿\n  後，發給土地所有權人各50 萬元補償費。請問：\n  甲為土地所有權人之一，反對提供土地作為堤防興建工程之用，應提\n   起何種行政訴訟？（10 分）\n  乙為另一土地所有權人，認為50 萬元補償費過低，應提起何種行政\n    訴訟？（10 分）\n  於甲提起之訴訟中，堤防興建工程已完成，行政法院如認定徵收案違\n   法，但認為堤防工程有公益上之需要，得為如何之判決？（5 分）\n                                                                               21050-21150\n                                                                              22150-22250\n                                                                            22450\n                                                                              22750-22950\n                                                                              23150-23550\n                                                                            24750"}];const ALL=EXAMS.flatMap(e=>e.questions.map(q=>({...q,exam:e.id,year:e.year,subject:e.subject,source:e.source,ansSource:e.ansSource,note:e.note,mod:e.mod})));
function stripOcrNoiseLines(text){return String(text??'').replace(/\r/g,'').split('\n').filter(line=>!/^\s*\d{4,5}(?:\s*[、,]\s*\d{4,5}|\s*[-－–]\s*\d{4,5})*\s*$/.test(line)).join('\n')}
function fixCjkBreaks(text){let t=String(text??'');let prev='';while(prev!==t){prev=t;t=t.replace(/([\u3400-\u9FFF])\s+([\u3400-\u9FFF])/g,'$1$2')}return t}
function cleanChoiceText(text){return fixCjkBreaks(stripOcrNoiseLines(text).replace(/\s*\n\s*/g,' ').replace(/[ \t]{2,}/g,' ').trim())}
function cleanEssayText(text){let t=stripOcrNoiseLines(text);t=t.replace(/\n\s*([])/g,'\n$1');t=t.replace(/([。；：？！）])\s*\n\s*/g,'$1\n');t=t.replace(/([^。；：？！）\n])\s*\n\s*/g,'$1 ');t=t.replace(/[ \t]{2,}/g,' ');t=t.replace(/\n{3,}/g,'\n\n');return fixCjkBreaks(t).trim()}
ALL.forEach(q=>{q.stem=cleanChoiceText(q.stem);q.choices=(q.choices||[]).map(cleanChoiceText);if(q.note)q.note=cleanEssayText(q.note)});
ESSAYS.forEach(q=>{q.stem=cleanEssayText(q.stem)});
const BYID=Object.fromEntries(ALL.map(q=>[q.id,q]));const STORE='morandi-admin-quiz-v1';let state={done:{},wrong:{},essays:{}};try{const obj=JSON.parse(localStorage.getItem(STORE));if(obj&&obj.done&&obj.wrong)state={...state,...obj,essays:obj.essays||{}}}catch(e){}let view='home',session=[],pos=0,answered=false;const el=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>safe(x).replace(/\n/g,'<br>');const uniq=a=>[...new Set(a)];function save(){localStorage.setItem(STORE,JSON.stringify(state))}function pool(){return ALL.filter(q=>(el('subject').value==='all'||q.subject===el('subject').value)&&(el('year').value==='all'||String(q.year)===el('year').value)&&(el('exam').value==='all'||q.exam===el('exam').value))}function selects(){const s=el('subject'),y=el('year');s.innerHTML='<option value="all">全部科目</option>'+uniq(EXAMS.map(e=>e.subject)).map(x=>`<option>${safe(x)}</option>`).join('');y.innerHTML='<option value="all">全部年度</option>'+uniq(EXAMS.map(e=>e.year)).sort((a,b)=>b-a).map(x=>`<option value="${x}">${x} 年</option>`).join('');s.value='行政法';if(!s.value)s.value='all';updateExams()}function updateExams(){const ex=EXAMS.filter(e=>(el('subject').value==='all'||e.subject===el('subject').value)&&(el('year').value==='all'||String(e.year)===el('year').value));el('exam').innerHTML='<option value="all">全部試卷</option>'+ex.map(e=>`<option value="${e.id}">${e.year}年 · ${safe(e.subject)} · ${e.code} (${e.questions.length}題)</option>`).join('');if(view==='home')render()}let quizStartedAt=null,quizElapsedMs=0,quizFinishedMs=null,quizTicker=null;
function formatQuizTime(ms){const sec=Math.floor(Math.max(0,ms)/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function getQuizElapsed(){return quizStartedAt===null?quizElapsedMs:quizElapsedMs+(Date.now()-quizStartedAt)}
function refreshQuizClock(){const node=document.getElementById('quizClockValue');if(node)node.textContent=formatQuizTime(getQuizElapsed())}
function stopQuizClock(finished=false){if(quizStartedAt!==null){quizElapsedMs=getQuizElapsed();quizStartedAt=null}if(quizTicker!==null){clearInterval(quizTicker);quizTicker=null}if(finished)quizFinishedMs=quizElapsedMs}
function beginQuizClock(){stopQuizClock();quizElapsedMs=0;quizFinishedMs=null;quizStartedAt=Date.now();quizTicker=setInterval(refreshQuizClock,250)}
function go(v){if(view==='quiz'&&v!=='quiz')stopQuizClock();view=v;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function render(){const main=el('main'),done=Object.keys(state.done).filter(id=>BYID[id]).length,wr=Object.keys(state.wrong).filter(id=>BYID[id]).length;el('totalStat').textContent=(ALL.length+ESSAYS.length).toLocaleString('zh-TW');el('multipleStat').textContent=ALL.length.toLocaleString('zh-TW');el('essayStat').textContent=ESSAYS.length.toLocaleString('zh-TW');el('doneStat').textContent=done+' / '+ALL.length+' ('+(ALL.length?((done/ALL.length)*100).toFixed(1):'0')+'%)';if(view==='home'){const ps=pool(),remaining=ps.filter(q=>!state.done[q.id]).length;main.innerHTML=`<h2>今天想練習什麼？</h2><div class="muted">每道題目只進入一般測驗一次，作答錯誤會自動加入錯題區。</div><div class="stats"><div class="stat"><strong>${ALL.length}</strong><small>收錄題目</small></div><div class="stat"><strong>${done}</strong><small>已作答</small></div><div class="stat"><strong>${wr}</strong><small>待複習錯題</small></div></div><div class="hint">目前篩選 <b>${ps.length}</b> 題，其中 <b>${remaining}</b> 題尚未作答。<br>題目旁將顯示對應答案來源；作答後顯示標準答案。</div><div class="stack"><button class="btn primary" onclick="start(false)">抽取未作答題目</button><button class="btn" onclick="go('wrong')">複習錯題</button><button class="btn" onclick="go('essays')">申論題（${ESSAYS.length} 題）</button></div><div class="notebox">注意：本題庫來自提供的考畢題答 PDF。選項文字無法可靠擷取的題目未納入。更正答案以 MOD 優先；特殊更正、複數給分依原始備註處理，無法明確判斷的更正題不自動評分。</div>`}else if(view==='quiz')drawQuestion();else if(view==='wrong')drawWrong();else if(view==='history')drawHistory();else if(view==='sources')drawSources();else if(view==='browse')drawBrowse();else if(view==='essays')drawEssays();else if(view==='finish'){main.innerHTML=`<h2>本回練習完成</h2><div class="quiz-clock"><span>⏱ 本回測驗耗時</span><span class="clock-value">${formatQuizTime(quizFinishedMs??getQuizElapsed())}</span></div><p>已完成 ${session.length} 題。可前往錯題區反覆複習，或開始下一回未做過的題目。</p><div class="stack"><button class="btn primary" onclick="go('home')">回到總覽</button><button class="btn" onclick="go('wrong')">錯題複習</button></div>`}}function start(review){let choices=review?Object.keys(state.wrong).map(id=>BYID[id]).filter(Boolean):pool().filter(q=>!state.done[q.id]);choices=choices.sort(()=>Math.random()-.5);if(!review)choices=choices.slice(0,Number(el('count').value));if(!choices.length){go(review?'wrong':'home');return}session=choices;pos=0;answered=false;beginQuizClock();view='quiz';document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));render()}function drawQuestion(){const q=session[pos];if(!q){view='finish';render();return}const record=state.done[q.id];const prior=!!record&&answered;const uncertain=q.answer==='#'||!/^([ABCD]{1,4})$/.test(q.answer);el('main').innerHTML=`<div class="muted">${safe(q.year)}年 · ${safe(q.subject)} · 試卷 ${safe(q.exam)} / 第 ${q.n} 題</div><div class="progress"><div style="width:${(pos+1)/session.length*100}%"></div></div><div class="muted">第 ${pos+1} / ${session.length} 題</div><div class="quiz-clock" role="timer" aria-label="測驗計時"><span>⏱ 測驗時間</span><span id="quizClockValue" class="clock-value">${formatQuizTime(getQuizElapsed())}</span></div><div class="questionTitle">${fmt(q.stem)}</div>${q.choices.map((c,i)=>`<button class="choice ${answered&&q.answer.includes('ABCD'[i])?'correct':''} ${answered&&record?.choice==='ABCD'[i]&&!q.answer.includes('ABCD'[i])?'wrong':''}" onclick="choose('${'ABCD'[i]}')" ${answered?'disabled':''}><b>${'ABCD'[i]}.</b><span>${fmt(c)}</span></button>`).join('')}${answered?`<div class="hint ${uncertain?'warn':''}"><b>${uncertain?'需參閱原始更正備註':record?.correct?'答對了':'本題答錯'}</b><br>當次標準答案：<b>${safe(q.answer==='#'?'更正題（依下列備註）':q.answer.split('').join(' 或 '))}</b>${q.note&&q.mod?`<div class="small">更正備註：${fmt(q.note)}</div>`:''}<div class="muted">答案依據：${safe(q.ansSource)}${q.mod?'（MOD 更正版本）':''}</div></div><div class="stack"><button class="btn primary" onclick="next()">${pos===session.length-1?'完成本回':'下一題 →'}</button>${state.wrong[q.id]?`<button class="btn" onclick="markMastered()">已熟練，移出錯題</button>`:''}</div>`:`<div class="muted">請選擇答案；選擇後才會顯示正解。</div>`}`}
function choose(choice){if(answered)return;const q=session[pos],uncertain=q.answer==='#'||!/^([ABCD]{1,4})$/.test(q.answer);const correct=!uncertain&&q.answer.includes(choice),isReview=!!state.wrong[q.id]&&!!state.done[q.id];if(!isReview){state.done[q.id]={choice,correct:uncertain?null:correct,time:new Date().toISOString()};if(!correct&&!uncertain)state.wrong[q.id]={attempts:0}}else{state.wrong[q.id].attempts=(state.wrong[q.id].attempts||0)+1;state.wrong[q.id].lastCorrect=correct;state.wrong[q.id].lastTime=new Date().toISOString()}save();answered=true;drawQuestion()}function next(){pos++;answered=false;if(pos>=session.length){stopQuizClock(true);view='finish'}render()}function markMastered(){delete state.wrong[session[pos].id];save();drawQuestion()}function drawWrong(){const ids=Object.keys(state.wrong).filter(id=>BYID[id]);el('main').innerHTML=`<h2>錯題複習區</h2><div class="muted">共有 ${ids.length} 題。錯題不再進入一般題庫，可重複練習直到主動標記熟練。</div><div class="stack"><button class="btn primary" onclick="start(true)" ${!ids.length?'disabled':''}>開始錯題複習</button></div>${ids.length?ids.slice(0,150).map(id=>{const q=BYID[id];return `<div class="reviewItem"><strong>${q.year} 年 · ${safe(q.subject)} · 第 ${q.n} 題</strong><p>${fmt(q.stem)}</p><div class="reviewOptions">${q.choices.map((o,i)=>'ABCD'[i]+'. '+fmt(o)).join('<br>')}</div><div class="hint">答案：<b>${safe(q.answer)}</b> · 來源：${safe(q.ansSource)}</div><button class="btn" onclick="delete state.wrong['${id}'];save();render()">標記熟練 / 移出錯題</button></div>`}).join(''):'<div class="empty">目前沒有待複習的錯題</div>'}`}
function drawHistory(){const entries=Object.entries(state.done).filter(([id])=>BYID[id]).sort((a,b)=>b[1].time.localeCompare(a[1].time));el('main').innerHTML=`<h2>已作答紀錄</h2><div class="muted">共 ${entries.length} 題；答對 ${entries.filter(x=>x[1].correct===true).length} 題，答錯 ${entries.filter(x=>x[1].correct===false).length} 題，待人工核對 ${entries.filter(x=>x[1].correct===null).length} 題。</div>${entries.slice(0,200).map(([id,r])=>{let q=BYID[id];return `<div class="reviewItem"><b>${q.year}年 ${safe(q.subject)} 第${q.n}題</b><div class="small">選 ${safe(r.choice)}　標準答案 ${safe(q.answer)}　${r.correct===null?'需核對':r.correct?'✓ 正確':'× 錯誤'}　${safe(r.time.slice(0,10))}</div></div>`}).join('')}`}
function drawBrowse(){
 const qs=pool(),main=el('main');
 const pageSize=30;
 const page=Math.max(0,Math.min(window.browsePage||0,Math.max(0,Math.ceil(qs.length/pageSize)-1)));
 window.browsePage=page;
 const shown=qs.slice(page*pageSize,(page+1)*pageSize);
 main.innerHTML=`<h2>瀏覽題庫</h2><p class="muted">目前篩選 ${qs.length} 題；僅供閱讀，不會將題目標記為已作答。點開「查看標準答案」即可檢查。</p>${shown.map(q=>`<section class="reviewItem"><div class="small muted">${safe(q.year||'')} 年 · ${safe(q.subject||'')} · 第 ${safe(q.n||'')} 題</div><p class="questionTitle">${fmt(q.stem||'')}</p><div class="reviewOptions">${(q.choices||[]).map((v,i)=>`<div>${'ABCD'[i]||i+1}. ${fmt(v)}</div>`).join('')}</div><details class="browse-answer"><summary>查看標準答案</summary><div class="hint">${safe(q.answer==='#'?'更正題，請核對原始備註':(q.answer||'未提供'))}</div></details></section>`).join('')||'<p class="empty">沒有符合篩選條件的題目。</p>'}<div class="browse-pagination"><button class="btn" ${page===0?'disabled':''} onclick="window.browsePage=${page-1};drawBrowse()">上一頁</button><span>第 ${page+1} / ${Math.max(1,Math.ceil(qs.length/pageSize))} 頁</span><button class="btn" ${page>=(Math.ceil(qs.length/pageSize)-1)?'disabled':''} onclick="window.browsePage=${page+1};drawBrowse()">下一頁</button></div>`;
}
function drawSources(){el('main').innerHTML=`<h2>試卷與答案來源</h2><div class="muted">依同一年度、試卷代號及科目配對。若有 MOD 優先採用 MOD。</div>${EXAMS.map(e=>`<div class="reviewItem"><b>${e.year} 年 ${safe(e.subject)} · ${e.code}</b><div class="small">收錄 ${e.questions.length} 題／答案表 ${e.answerCount} 題${e.missingNumbers?.length?` · 未收錄題號：${e.missingNumbers.join("、")}`:" · 已全數收錄"}　${e.mod?'<span class="pill">MOD優先</span>':''}</div><div class="small">題目：${safe(e.source)}<br>答案：${safe(e.ansSource)}</div>${e.note&&e.mod?`<div class="notebox">${fmt(e.note)}</div>`:''}</div>`).join('')}`}

const ESSAY_STORE_KEY='morandi-essay-api-key-v1';
let essaysFilter='all';
const getEssay=id=>ESSAYS.find(x=>x.id===id);
function drawEssays(){
 const filtered=ESSAYS.filter(q=>(el('subject').value==='all'||q.subject===el('subject').value)&&(el('year').value==='all'||String(q.year)===el('year').value)&&(el('exam').value==='all'||q.exam===el('exam').value));
 el('main').innerHTML=`<h2>申論題練習</h2><p class="muted">共收錄 ${ESSAYS.length} 題，本次篩選 ${filtered.length} 題。每題文字在手機瀏覽器自動儲存，無須按「儲存」。請勿使用無痕模式，並定期匯出紀錄。</p><details class="settings"><summary>線上參考答案設定（可選）</summary><div class="notebox">點「AI 線上檢索」會透過 Google Gemini API 的 Google 搜尋 grounding 產生參考答題架構；需要網路及個人 API Key。網路檢索不等於官方標準答案，請核對法規現行版本及考試年度。金鑰只儲存在目前瀏覽器，不會包含在匯出的學習紀錄內；在共用裝置上不建議保存。</div><label for="apiKey">Google Gemini API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="輸入你的 API Key"><div class="stack"><button class="btn" onclick="saveApiKey()">儲存此裝置的金鑰</button><button class="btn secondary" onclick="removeApiKey()">移除金鑰</button></div><p class="small">API Key 可由 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a> 取得；服務可用性、額度及費用依供應商而定。</p></details>
 ${filtered.length?filtered.map(q=>{const v=state.essays[q.id]||{};const term=q.stem.replace(/\s+/g,' ').slice(0,110);const query=encodeURIComponent(q.year+'年 '+q.subject+' 申論題 '+term);return `<section class="essay-card"><div class="muted">${q.year} 年 · ${safe(q.subject)} · 第 ${q.n} 題</div><div class="questionTitle">${fmt(q.stem)}</div><label for="essay_${safe(q.id)}">我的申論答案</label><textarea class="essayTextarea" id="essay_${safe(q.id)}" data-essay-id="${safe(q.id)}" placeholder="在這裡輸入你的作答，輸入時自動記憶……">${safe(v.draft||'')}</textarea><div class="save-indicator" id="saved_${safe(q.id)}">${v.updatedAt?'已記錄：'+safe(new Date(v.updatedAt).toLocaleString('zh-TW')):'尚未作答'}</div><div class="stack"><button class="btn primary" onclick="lookupEssay('${safe(q.id)}',this)">AI 線上檢索參考答案</button><button class="btn" onclick="toggleEssayReference('${safe(q.id)}')">查看已儲存的參考內容</button></div><div class="search-links"><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${query}">Google 搜尋原題</a><a target="_blank" rel="noopener noreferrer" href="https://law.moj.gov.tw/">全國法規資料庫</a><a target="_blank" rel="noopener noreferrer" href="https://www.judicial.gov.tw/">司法院</a></div><div id="ref_${safe(q.id)}" class="essayAnswer" style="display:none">${fmt(v.reference||'尚未查詢。線上資訊僅供對照，並非官方閱卷標準。')}</div><div class="small muted">題目來源：${safe(q.source)}</div></section>`}).join(''):'<div class="empty">目前所選範圍沒有擷取到申論題，請調整上方科目／年度／試卷。</div>'}`;
 el('main').querySelectorAll('textarea[data-essay-id]').forEach(a=>a.addEventListener('input',()=>{const id=a.dataset.essayId;state.essays[id]={...(state.essays[id]||{}),draft:a.value,updatedAt:new Date().toISOString()};try{save();let x=el('saved_'+id);if(x)x.textContent='已自動儲存於此裝置 '+new Date().toLocaleTimeString('zh-TW')}catch(e){let x=el('saved_'+id);if(x)x.textContent='⚠ 儲存空間不足，請匯出學習紀錄'}}));
}
function toggleEssayReference(id){const node=el('ref_'+id);node.style.display=node.style.display==='none'?'block':'none'}
function saveApiKey(){const k=el('apiKey').value.trim();if(k){localStorage.setItem(ESSAY_STORE_KEY,k);el('apiKey').value='';alert('已儲存在這台裝置的瀏覽器')}}
function removeApiKey(){localStorage.removeItem(ESSAY_STORE_KEY);el('apiKey').value='';alert('已移除此裝置的 API Key')}
async function lookupEssay(id,btn){const q=getEssay(id),key=localStorage.getItem(ESSAY_STORE_KEY);if(!key){alert('尚未設定 API Key。請先展開「線上參考答案設定」；也可先點 Google 搜尋原題和全國法規資料庫核對。');return}const out=el('ref_'+id);out.style.display='block';out.textContent='正在檢索網頁並整理參考答案……';btn.disabled=true;
 try{const req={contents:[{parts:[{text:`請以臺灣公務人員國家考試之申論題答題方式作答。科目：${q.subject}；考試年度：民國${q.year}年。題目：${q.stem}\n\n請搜尋公開資料與法規，以「爭點／法規依據／涵攝分析／結論」構成答題架構。明確標明可能修法差異、無法確認的內容；切勿偽稱考選部官方詳解。全程繁體中文。` }]}],tools:[{google_search:{}}],generationConfig:{temperature:0.2}};
 const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(req)});const data=await res.json();if(!res.ok)throw Error(data.error?.message||'請檢查 API 金鑰、網路和配額');let answer=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();const refs=data.candidates?.[0]?.groundingMetadata?.groundingChunks||[];const sources=refs.map(x=>x.web).filter(Boolean).map((w,i)=>`${i+1}. ${w.title||'來源'} — ${w.uri||''}`).join('\n');if(!answer)throw Error('搜尋服務沒有傳回答案');const output=answer+(sources?'\n\n搜尋引用來源（請自行核查）\n'+sources:'\n\n未傳回可驗證的網頁來源，請另行查核。');out.textContent=output;state.essays[id]={...(state.essays[id]||{}),reference:output,referenceAt:new Date().toISOString()};save();}catch(err){out.textContent='無法取得線上參考答案：'+err.message+'。你仍可使用下方 Google 搜尋與官方法規網站，且不影響已儲存的作答。'}finally{btn.disabled=false}
}

el('subject').onchange=()=>{updateExams();if(view==='essays')drawEssays()};el('year').onchange=()=>{updateExams();if(view==='essays')drawEssays()};el('exam').onchange=()=>{if(view==='home'||view==='essays')render()};el('start').onclick=()=>start(false);el('browse').onclick=()=>go('browse');document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.view));el('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='行政法測驗學習紀錄.json';a.click();URL.revokeObjectURL(a.href)};el('import').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o.state||typeof o.state.done!=='object'||typeof o.state.wrong!=='object')throw Error();if(!confirm('匯入將取代目前紀錄，確定嗎？'))return;state={done:o.state.done,wrong:o.state.wrong,essays:o.state.essays||{}};save();go('home')}catch(e){alert('紀錄格式不正確')}};el('reset').onclick=()=>{if(confirm('確定清除所有已作答及錯題紀錄？此操作無法復原。')){state={done:{},wrong:{},essays:{}};save();go('home')}};selects();render();</script></body></html>
